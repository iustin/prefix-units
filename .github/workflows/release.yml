name: Release

on:
  # The tag must point at the commit whose cabal file already names
  # that version, including the source-repository tag. `make
  # release-tag` creates such a tag; `make check-tag` verifies it.
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  hackage-candidate:
    name: Upload Hackage candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "latest"
          cabal-version: "latest"

      # This gates the whole release, not just the upload. It runs here
      # because `cabal check` needs the toolchain set up above, and
      # github-release only runs after this job succeeds.
      - name: Check the tag against the cabal file and changelog
        run: make check-tag TAG="$GITHUB_REF_NAME"

      - name: Build the source and documentation archives
        run: make hackage-dist HACKAGE_DIR="${RUNNER_TEMP}"

      # publish: false uploads a candidate. Publishing it on Hackage
      # is a separate, permanent step.
      - name: Upload candidate
        uses: haskell-actions/hackage-publish@v1
        with:
          hackageServer: https://hackage.haskell.org
          hackageToken: ${{ secrets.HACKAGE_AUTH_TOKEN }}
          packagesPath: ${{ runner.temp }}/packages
          docsPath: ${{ runner.temp }}/docs
          publish: false

  # Runs only after the candidate upload succeeds, so a failed upload
  # does not leave a draft release behind. This is the only job that
  # can write to the repository, and it never sees the Hackage token.
  github-release:
    name: Draft GitHub release
    needs: hackage-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make -s release-notes > "${RUNNER_TEMP}/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${RUNNER_TEMP}/notes.md"
